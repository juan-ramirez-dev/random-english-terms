[package]
name = "lexio"
version = "0.10.0"
description = "English vocabulary from your own readings"
authors = ["Juan Ramirez"]
license = "MIT"
repository = "https://github.com/juan-ramirez-dev/random-english-terms"
edition = "2024"
rust-version = "1.90"

[lib]
# Different name from the binary: avoids a name clash on Windows.
name = "lexio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
# AI: validate online keys (HTTP) and download local models to disk.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
tokio = { version = "1.53.3", features = ["fs", "io-util", "time"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
# API keys live in the OS keychain, never in SQLite or logs.
keyring = "4.2.0"
# Local AI (llama.cpp), linked statically into the app. No openmp: Apple's clang doesn't ship it.
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common", "metal"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
