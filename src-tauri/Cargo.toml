[package]
name = "lexio"
version = "0.3.0"
description = "English vocabulary from your own readings"
authors = ["Juan Ramirez"]
license = "MIT"
repository = "https://github.com/juan-ramirez-dev/random-english-terms"
edition = "2024"
rust-version = "1.90"

[lib]
# Different name from the binary: avoids a name clash on Windows.
name = "lexio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
